name: Testlar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-testlari:
    runs-on: ubuntu-latest

    # Vaqtinchalik Postgres konteyner - faqat shu CI ishga tushishi davomida
    # yashaydi, real production bazasiga hech qanday aloqasi yo'q.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_parol
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bog'liqliklarni o'rnatish
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Sinov uchun .env yaratish
        # Bu yerdagi qiymatlar FAQAT shu vaqtinchalik CI konteyneri ichida
        # ishlatiladi - hech biri real production .env'dagi haqiqiy
        # maxfiy ma'lumot emas. backend/.env hech qachon git'ga
        # commit qilinmaydi (.gitignore'da) - shu sabab CI'da har safar
        # noldan, shu yerda yaratiladi.
        working-directory: backend
        run: |
          cat <<'EOF' > .env
          DATABASE_URL=postgresql+psycopg2://postgres:ci_test_parol@localhost:5432/hazorasp_tarozi?client_encoding=utf8
          SECRET_KEY=ci-faqat-sinov-uchun-maxfiy-kalit-emas-9f3kQzP82nQeY
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=480
          TAROZI_AGENT_KEY=ci-test-kaliti
          EOF

      - name: Testlarni ishga tushirish
        working-directory: backend
        run: pytest tests/ -v

      - name: Bog'liqliklarni xavfsizlik bo'yicha skanerlash
        # requirements.txt'dagi paketlarni PyPI/OSV zaifliklar bazasi
        # bilan solishtiradi - agar mashhur CVE'ga ega eski versiya
        # aniqlansa, build QIZARADI (build'ni to'xtatmaydigan skaner
        # amalda e'tiborsiz qoldiriladi). `ecdsa`dagi PYSEC-2026-1325
        # ATAYLAB e'tiborsiz qoldirilgan - eng so'nggi versiyada ham
        # tuzatilmagan (yuqori darajadagi python-jose kutubxonasining
        # bilvosita bog'liqligi), va biz FAQAT HS256 (HMAC) algoritmini
        # ishlatamiz - ecdsa'ning zaif elliptik egri chiziq kodi
        # umuman chaqirilmaydi.
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

  frontend-testlari:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Flutter o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable

      - name: Bog'liqliklarni o'rnatish
        working-directory: frontend
        run: flutter pub get

      # frontend/integration_test/ papkasidagi fayllar ATAYLAB shu yerga
      # kirmaydi - ular real, ishlab turgan backendga (office LAN) ulanib
      # sinaydigan qo'lda ishga tushiriladigan tekshiruvlar, GitHub Actions
      # hosted runner'i office LAN'ga yeta olmaydi. `flutter test`
      # (argumentsiz) faqat `frontend/test/` papkasini skanerlaydi.
      - name: Testlarni ishga tushirish
        working-directory: frontend
        run: flutter test
